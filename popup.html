<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptStow</title>
    <style>
        /* ---------- Design tokens ---------- */
        :root {
            --bg: #ffffff;
            --surface: #fafafa;
            --surface-2: #f1f2f4;
            --text: #18181b;
            --muted: #71717a;
            --faint: #a1a1aa;
            --border: #e7e7ea;
            --border-strong: #d4d4d8;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: rgba(79, 70, 229, 0.10);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.10);
            --success: #16a34a;
            --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.06);
            --shadow-md: 0 10px 24px rgba(24, 24, 27, 0.12);
            --shadow-lg: 0 18px 48px rgba(24, 24, 27, 0.20);
            --r-xs: 5px;
            --r-sm: 7px;
            --r-md: 10px;
            --r-pill: 999px;
            --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
            --t-fast: 110ms var(--ease);
            --t: 160ms var(--ease);
        }

        body[data-theme="dark"] {
            --bg: #0e0e10;
            --surface: #161618;
            --surface-2: #232327;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --faint: #71717a;
            --border: #27272a;
            --border-strong: #3f3f46;
            --accent: #818cf8;
            --accent-hover: #a5b4fc;
            --accent-soft: rgba(129, 140, 248, 0.16);
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.16);
            --success: #34d399;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.55);
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="auto"] {
                --bg: #0e0e10;
                --surface: #161618;
                --surface-2: #232327;
                --text: #f4f4f5;
                --muted: #a1a1aa;
                --faint: #71717a;
                --border: #27272a;
                --border-strong: #3f3f46;
                --accent: #818cf8;
                --accent-hover: #a5b4fc;
                --accent-soft: rgba(129, 140, 248, 0.16);
                --danger: #f87171;
                --danger-soft: rgba(248, 113, 113, 0.16);
                --success: #34d399;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
                --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.45);
                --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.55);
            }
        }

        /* ---------- Base ---------- */
        * { box-sizing: border-box; }

        body {
            width: 400px;
            min-height: 520px;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }

        .icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            display: block;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: var(--r-pill);
            border: 3px solid var(--bg);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
        ::-webkit-scrollbar-track { background: transparent; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        /* ---------- Header ---------- */
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 11px 12px 10px;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(8px);
            border-bottom: 1px solid var(--border);
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: var(--r-sm);
            background: var(--accent);
            color: #fff;
            flex: 0 0 auto;
        }

        .brand-mark .icon { width: 13px; height: 13px; }

        h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 30px;
            padding: 0 11px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            background: var(--bg);
            color: var(--text);
            font-weight: 550;
            white-space: nowrap;
            transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
        }

        .btn:hover { background: var(--surface-2); }
        .btn:active { transform: translateY(0.5px); }

        .btn-primary {
            border-color: transparent;
            background: var(--accent);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-danger { color: var(--danger); }
        .btn-danger:hover {
            background: var(--danger-soft);
            border-color: color-mix(in srgb, var(--danger) 40%, var(--border-strong));
        }

        /* Square ghost icon button (toolbar + folder actions) */
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: var(--r-sm);
            background: transparent;
            color: var(--muted);
            transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
        }
        .icon-btn:hover {
            background: var(--surface-2);
            color: var(--text);
        }
        .icon-btn:active { transform: translateY(0.5px); }
        .icon-btn.is-danger:hover { background: var(--danger-soft); color: var(--danger); }

        /* ---------- Search + filters ---------- */
        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrap .icon {
            position: absolute;
            left: 10px;
            color: var(--faint);
            pointer-events: none;
        }
        #searchInput {
            width: 100%;
            height: 34px;
            padding: 0 12px 0 32px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            background: var(--surface);
            color: var(--text);
            transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
        }
        #searchInput::placeholder { color: var(--faint); }
        #searchInput:focus {
            outline: none;
            background: var(--bg);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .filter-row { margin-top: 8px; }

        .selects {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .select-wrap { position: relative; }
        .select-wrap .icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--faint);
            pointer-events: none;
        }

        .select {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 32px;
            padding: 0 26px 0 10px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: border-color var(--t-fast), background var(--t-fast);
        }
        .select:hover { background: var(--surface-2); }
        .select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* ---------- Generic inputs ---------- */
        .input, .textarea {
            width: 100%;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            background: var(--surface);
            color: var(--text);
            padding: 8px 10px;
            transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
        }
        .input::placeholder, .textarea::placeholder { color: var(--faint); }
        .input:focus, .textarea:focus {
            outline: none;
            background: var(--bg);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .textarea {
            min-height: 84px;
            resize: vertical;
            line-height: 1.5;
        }

        /* ---------- Panels ---------- */
        .panel {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .panel[hidden] { display: none; }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--faint);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 12px;
        }

        .field { display: grid; gap: 5px; }
        .field label, .inline-label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
        }
        .inline-label {
            display: flex;
            gap: 9px;
            align-items: center;
            min-height: 30px;
            cursor: pointer;
        }
        .inline-label span { color: var(--text); font-weight: 550; }

        /* Toggle switch */
        .switch {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            flex: 0 0 auto;
            width: 34px;
            height: 20px;
            border-radius: var(--r-pill);
            background: var(--border-strong);
            cursor: pointer;
            transition: background var(--t-fast);
        }
        .switch::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: var(--shadow-sm);
            transition: transform var(--t-fast);
        }
        .switch:checked { background: var(--accent); }
        .switch:checked::before { transform: translateX(14px); }

        /* ---------- Folders ---------- */
        .folder-layout { display: grid; gap: 9px; }
        .folder-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .folder-actions { display: flex; gap: 2px; }
        .folder-tree {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .folder-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-pill);
            background: var(--bg);
            color: var(--muted);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 550;
            transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
        }
        .folder-chip:hover { background: var(--surface-2); color: var(--text); }
        .folder-chip .count {
            color: var(--faint);
            font-variant-numeric: tabular-nums;
        }
        .folder-chip.is-active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--text);
        }
        .folder-chip.is-active .count { color: var(--accent); }

        /* ---------- New prompt form ---------- */
        .new-prompt-form { display: none; }
        .form-grid { display: grid; gap: 10px; }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 2px;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        /* ---------- Prompt list ---------- */
        .content {
            max-height: 380px;
            overflow-y: auto;
            padding: 8px;
        }

        .loading, .empty-state {
            padding: 44px 22px;
            text-align: center;
            color: var(--muted);
        }
        .empty-state .empty-icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--faint);
        }
        .empty-state .empty-icon .icon { width: 22px; height: 22px; }
        .empty-state h3 {
            margin: 0 0 4px;
            color: var(--text);
            font-size: 14px;
            font-weight: 650;
        }
        .empty-state p { margin: 0; font-size: 12px; }

        .prompt-card {
            position: relative;
            display: flex;
            gap: 9px;
            padding: 9px 9px 9px 11px;
            margin-bottom: 3px;
            border: 1px solid transparent;
            border-radius: var(--r-md);
            background: transparent;
            transition: background var(--t-fast), border-color var(--t-fast);
        }
        .prompt-card::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 12px;
            bottom: 12px;
            width: 3px;
            border-radius: var(--r-pill);
            background: var(--card-accent, var(--accent));
            opacity: 0;
            transition: opacity var(--t-fast);
        }
        .prompt-card:hover {
            background: var(--surface);
            border-color: var(--border);
        }
        .prompt-card:hover::before { opacity: 0.55; }
        .prompt-card.is-active {
            background: var(--surface);
            border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
        }
        .prompt-card.is-active::before { opacity: 1; }

        /* favorite star */
        .fav {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-top: -1px;
            padding: 0;
            border: 0;
            border-radius: var(--r-sm);
            background: transparent;
            color: var(--faint);
            transition: color var(--t-fast), background var(--t-fast), transform var(--t-fast);
        }
        .fav:hover { background: var(--surface-2); color: var(--muted); transform: scale(1.08); }
        .fav .icon { width: 15px; height: 15px; }
        .prompt-card.is-favorite .fav {
            color: #f59e0b;
        }
        .prompt-card.is-favorite .fav .icon { fill: #f59e0b; }

        .card-text { flex: 1 1 auto; min-width: 0; }

        .prompt-title {
            font-weight: 650;
            line-height: 1.3;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .prompt-summary {
            margin-top: 1px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
            color: var(--faint);
            font-size: 11px;
            min-width: 0;
        }
        .meta .tag {
            color: var(--muted);
            font-weight: 550;
        }
        .meta .dot { color: var(--border-strong); }
        .meta .uses { font-variant-numeric: tabular-nums; }

        .card-actions {
            display: flex;
            align-items: flex-start;
            gap: 1px;
            flex: 0 0 auto;
            opacity: 0.42;
            transition: opacity var(--t-fast);
        }
        .prompt-card:hover .card-actions,
        .prompt-card:focus-within .card-actions,
        .prompt-card.is-active .card-actions { opacity: 1; }

        .act {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 0;
            border-radius: var(--r-sm);
            background: transparent;
            color: var(--muted);
            transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
        }
        .act .icon { width: 15px; height: 15px; }
        .act:hover { background: var(--surface-2); color: var(--text); }
        .act:active { transform: translateY(0.5px); }
        .act.act-insert {
            color: #fff;
            background: var(--accent);
            opacity: 1;
        }
        .act.act-insert:hover { background: var(--accent-hover); }
        .act.act-danger:hover { background: var(--danger-soft); color: var(--danger); }

        /* ---------- Footer ---------- */
        .footer {
            border-top: 1px solid var(--border);
            padding: 8px 12px;
            background: var(--surface);
            color: var(--faint);
            text-align: center;
            font-size: 11px;
        }
        .footer a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover { color: var(--accent); }

        /* ---------- Modal ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(9, 9, 11, 0.55);
            padding: 18px;
            animation: fade-in 140ms var(--ease);
        }
        .modal {
            width: min(360px, 100%);
            max-height: 500px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            background: var(--bg);
            color: var(--text);
            box-shadow: var(--shadow-lg);
            animation: pop-in 160ms var(--ease);
        }
        .modal-header, .modal-body, .modal-footer { padding: 14px; }
        .modal-header {
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 14px;
        }
        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            border-top: 1px solid var(--border);
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pop-in {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: none; }
        }

        .history-item, .stat-row {
            border-bottom: 1px solid var(--border);
            padding: 11px 0;
        }
        .history-item:first-child, .stat-row:first-child { padding-top: 0; }
        .history-item:last-child, .stat-row:last-child { border-bottom: 0; padding-bottom: 0; }
        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .stat-row.is-block { display: block; }

        .diff {
            margin-top: 8px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            overflow: hidden;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
        }
        .diff-line { padding: 3px 8px; white-space: pre-wrap; }
        .diff-line.add { background: color-mix(in srgb, var(--success) 16%, var(--bg)); }
        .diff-line.del { background: color-mix(in srgb, var(--danger) 14%, var(--bg)); }

        .bar {
            height: 7px;
            margin-top: 7px;
            border-radius: var(--r-pill);
            background: var(--surface-2);
            overflow: hidden;
        }
        .bar span {
            display: block;
            height: 100%;
            border-radius: var(--r-pill);
            background: var(--accent);
            transition: width var(--t);
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 320px;
            border-radius: var(--r-sm);
            padding: 9px 13px;
            background: var(--text);
            color: var(--bg);
            font-weight: 550;
            box-shadow: var(--shadow-md);
            animation: toast-in 200ms var(--ease);
        }
        .toast.is-error { background: var(--danger); color: #fff; }
        @keyframes toast-in {
            from { opacity: 0; transform: translate(-50%, 8px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body data-theme="auto">
    <header class="header">
        <div class="top-row">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
                </span>
                <h1 data-i18n="appName">PromptStow</h1>
            </div>
            <div class="toolbar">
                <button class="icon-btn" id="settingsBtn" data-i18n-title="settings" aria-label="Settings">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button class="icon-btn" id="statsBtn" data-i18n-title="stats" aria-label="Stats">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
                </button>
                <button class="icon-btn" id="importBtn" data-i18n-title="import" aria-label="Import">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
                </button>
                <button class="icon-btn" id="exportBtn" data-i18n-title="export" aria-label="Export">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
                </button>
                <button class="btn btn-primary" id="newPromptBtn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span data-i18n="newPrompt">New</span>
                </button>
            </div>
        </div>
        <div class="filter-row">
            <div class="search-wrap">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
                <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search prompts...">
            </div>
            <div class="selects">
                <div class="select-wrap">
                    <select class="select" id="tagFilter">
                        <option value="" data-i18n="allTags">All Tags</option>
                    </select>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <div class="select-wrap">
                    <select class="select" id="sortSelect" aria-label="Sort">
                        <option value="recent" data-i18n="recent">Recent</option>
                        <option value="most-used" data-i18n="mostUsed">Most used</option>
                        <option value="az" data-i18n="az">A-Z</option>
                        <option value="favorites" data-i18n="favoritesFirst">Favorites first</option>
                    </select>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </div>
            </div>
        </div>
    </header>

    <section class="panel" id="settingsPanel" hidden>
        <div class="settings-grid">
            <div class="field">
                <label for="themeSelect" data-i18n="theme">Theme</label>
                <div class="select-wrap">
                    <select class="select" id="themeSelect">
                        <option value="auto">Auto</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </div>
            </div>
            <div class="field">
                <label for="localeSelect" data-i18n="locale">Language</label>
                <div class="select-wrap">
                    <select class="select" id="localeSelect">
                        <option value="en">English</option>
                        <option value="fa">فارسی</option>
                    </select>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </div>
            </div>
            <label class="inline-label">
                <input type="checkbox" class="switch" id="slashEnabled">
                <span data-i18n="slashTrigger">Slash trigger</span>
            </label>
            <label class="inline-label">
                <input type="checkbox" class="switch" id="syncEnabled">
                <span data-i18n="syncSettings">Sync settings</span>
            </label>
            <div class="field">
                <label for="slashTriggerInput" data-i18n="trigger">Trigger</label>
                <input class="input" id="slashTriggerInput" maxlength="4" value="/">
            </div>
            <div class="field">
                <label for="slashMaxResults" data-i18n="maxResults">Max results</label>
                <input class="input" id="slashMaxResults" type="number" min="1" max="20" value="8">
            </div>
        </div>
    </section>

    <section class="panel folder-layout">
        <div class="folder-head">
            <span class="panel-title" data-i18n="folders">Folders</span>
            <div class="folder-actions">
                <button class="icon-btn" id="addFolderBtn" data-i18n-title="addFolder" aria-label="Add folder">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 4.9A2 2 0 0 0 7.93 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/><path d="M12 11v6"/><path d="M9 14h6"/></svg>
                </button>
                <button class="icon-btn" id="renameFolderBtn" data-i18n-title="renameFolder" aria-label="Rename folder">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
                <button class="icon-btn is-danger" id="deleteFolderBtn" data-i18n-title="deleteFolder" aria-label="Delete folder">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
        <div class="folder-tree" id="folderTree"></div>
    </section>

    <section class="panel new-prompt-form" id="newPromptForm">
        <div class="form-grid">
            <div class="field">
                <label for="promptTitle" data-i18n="title">Title</label>
                <input type="text" class="input" id="promptTitle">
            </div>
            <div class="field">
                <label for="promptSummary" data-i18n="summary">Summary</label>
                <textarea class="textarea" id="promptSummary" style="min-height: 54px;"></textarea>
            </div>
            <div class="field">
                <label for="promptText" data-i18n="promptText">Prompt text</label>
                <textarea class="textarea" id="promptText"></textarea>
            </div>
            <div class="field">
                <label for="promptTags" data-i18n="tags">Tags</label>
                <input type="text" class="input" id="promptTags" placeholder="tag1, tag2">
            </div>
            <div class="field">
                <label for="promptFolder" data-i18n="folder">Folder</label>
                <div class="select-wrap">
                    <select class="select" id="promptFolder"></select>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn" id="cancelBtn" data-i18n="cancel">Cancel</button>
                <button class="btn btn-primary" id="saveBtn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                    <span data-i18n="save">Save</span>
                </button>
            </div>
        </div>
    </section>

    <main class="content" id="promptsList">
        <div class="loading" id="loading">Loading prompts...</div>
    </main>

    <input type="file" id="importFileInput" accept=".json" hidden>
    <div id="modalRoot"></div>

    <footer class="footer">
        Crafted by <a href="https://www.linkedin.com/in/behnood-rahbari/" target="_blank" rel="noreferrer">Behnood Rahbari</a>
    </footer>

    <script src="fuzzy.js"></script>
    <script src="template.js"></script>
    <script src="history.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
</body>
</html>
